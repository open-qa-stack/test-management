# A PostgreSQL server for development and for an instance that keeps its database on one, reachable from
# this machine only. An instance needs none by default: its database is then a file in its test repository.
name: oqas
services:
  database:
    image: docker.io/library/postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: oqas
      POSTGRES_DB: oqas
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${OQAS_DATABASE_PORT:-5432}:5432"
    volumes:
      - database:/var/lib/postgresql
volumes:
  database:
