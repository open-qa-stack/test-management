# SonarCloud analysis, run by the pipeline after the check so that the coverage of
# the whole suite reaches the dashboard. Automatic analysis must stay off on the
# SonarCloud side: the two cannot run together.
sonar.projectKey=open-qa-stack_test-management
sonar.organization=open-qa-stack

sonar.sources=packages,apps,lint
sonar.inclusions=**/src/**,lint/*.ts
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**
sonar.tests=packages,apps,lint
sonar.test.inclusions=**/test/**

# The check keeps the coverage of every run of tests in one report, its paths from the root.
# What the manifests list under coverage.measuredInBrowser and coverage.runAsProgram is
# measured elsewhere, and left out here alike.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=apps/web/src/main.tsx,apps/web/src/app.tsx,packages/cli/src/main.ts,packages/tools/src/source-code/search-worker.ts
