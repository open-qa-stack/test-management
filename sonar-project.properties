# SonarCloud analysis, run by the pipeline after the check so that the coverage of
# the whole suite reaches the dashboard. Automatic analysis must stay off on the
# SonarCloud side: the two cannot run together.
sonar.projectKey=open-qa-stack_test-management
sonar.organization=open-qa-stack

# The scanner analyses every file of the repository, but the ones git ignores and those below. The
# fixtures of the tests are left out: they are sources of other languages, some invalid on purpose.
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,packages/*/test/fixtures/**

# The check keeps the coverage of every run of tests in one report, its paths from the root.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# What the check measures is the code under the src folder of each package and the lint rules. The
# tests, their support, the scripts and the configuration files are not measured, and neither is what
# the manifests list under coverage.measuredInBrowser and coverage.runAsProgram, which their tests
# measure elsewhere, a program the lint runs, nor a file that only declares types.
sonar.coverage.exclusions=\
  packages/*/test/**,\
  apps/*/test/**,\
  lint/test/**,\
  packages/*/scripts/**,\
  vitest.config.ts,\
  apps/web/vite.config.ts,\
  apps/web/src/main.tsx,\
  apps/web/src/app.tsx,\
  apps/web/src/configuration/configuration-page.tsx,\
  packages/cli/src/main.ts,\
  packages/tools/src/source-code/search-worker.ts,\
  lint/check-manifests.ts,\
  packages/api/src/api-entry.ts
