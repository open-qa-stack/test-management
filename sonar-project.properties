# SonarCloud analysis, run by the pipeline after the check so that the coverage of
# the whole suite reaches the dashboard. Automatic analysis must stay off on the
# SonarCloud side: the two cannot run together.
sonar.projectKey=open-qa-stack_test-management
sonar.organization=open-qa-stack

# The scanner analyses every file of the repository, but the ones git ignores and those below. The
# fixtures of the tests are left out: they are sources of other languages, some invalid on purpose.
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,packages/*/test/fixtures/**

# The check keeps the coverage of every run of tests in one report, its paths from the root.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# What the check measures is the code under the src folder of each package and the lint rules. The
# tests, their support, the scripts and the configuration files are not measured, and neither is what
# the manifests list under coverage.measuredInBrowser and coverage.runAsProgram, which their tests
# measure elsewhere, a program the lint runs, nor a file that only declares types.
sonar.coverage.exclusions=\
  packages/*/test/**,\
  apps/*/test/**,\
  lint/test/**,\
  packages/*/scripts/**,\
  vitest.config.ts,\
  apps/web/vite.config.ts,\
  apps/web/src/main.tsx,\
  apps/web/src/app.tsx,\
  apps/web/src/configuration/configuration-page.tsx,\
  apps/web/src/configuration/use-configuration-editor.ts,\
  apps/web/src/configuration/use-item-pages.ts,\
  apps/web/src/applications/applications-page.tsx,\
  apps/web/src/knowledge/knowledge-page.tsx,\
  apps/web/src/tests/tests-page.tsx,\
  apps/web/src/tests/test-page.tsx,\
  apps/web/src/executions/executions-page.tsx,\
  apps/web/src/executions/execution-page.tsx,\
  apps/web/src/executions/result-page.tsx,\
  apps/web/src/api/use-polled.ts,\
  packages/cli/src/main.ts,\
  packages/tools/src/source-code/search-worker.ts,\
  lint/check-manifests.ts,\
  packages/api/src/api-entry.ts

# Rules left out where they cannot tell what the code does, each for a reason the code cannot change.
sonar.issue.ignore.multicriteria=floatingTests,suiteFiles,waitedScreen,commandsOnPath,terminalControls,rejectedValue,testSecrets,witnessSecret

# S9383 is no-floating-promises of typescript-eslint, which the lint already runs on every file, with
# describe, it, suite and test of node:test as known safe: the runner of node:test awaits what they
# return. The analysis cannot be given that option, so it is left out of the tests that use them.
sonar.issue.ignore.multicriteria.floatingTests.ruleKey=typescript:S9383
sonar.issue.ignore.multicriteria.floatingTests.resourceKey=packages/*/test/**

# S2187 looks for a call of it or test in each test file. The tests of the API that go through a
# database are written once, in test/suites, and each of these files runs them on one database.
sonar.issue.ignore.multicriteria.suiteFiles.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.suiteFiles.resourceKey=packages/api/test/*-api.*.test.ts

# S2699 looks for an assertion in the body of each test. The tests of the conversation assert through
# the helpers of their stage, which wait for the screen to show a text and fail when it does not.
sonar.issue.ignore.multicriteria.waitedScreen.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.waitedScreen.resourceKey=packages/cli/test/conversation/conversation.test.ts

# S4036 asks for commands named by an absolute path. The product and its tests run git, npm, pnpm and
# the tools of the test repository where the person installed them, which only the PATH tells.
sonar.issue.ignore.multicriteria.commandsOnPath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.commandsOnPath.resourceKey=**/*

# S6324 refuses control characters in a regular expression. The terminal the tests of the command line
# read is made of them: the escape that starts a control sequence, and the bell that ends one.
sonar.issue.ignore.multicriteria.terminalControls.ruleKey=typescript:S6324
sonar.issue.ignore.multicriteria.terminalControls.resourceKey=packages/cli/test/support/fake-terminal.ts

# S6671 asks for an Error as the reason of a rejection. One test of the API rejects with a string on
# purpose, to check that the API logs what was raised as it is when it is no error.
sonar.issue.ignore.multicriteria.rejectedValue.ruleKey=typescript:S6671
sonar.issue.ignore.multicriteria.rejectedValue.resourceKey=packages/api/test/suites/sessions-api.ts

# S2068 and S6698 find a password in the code. The tests hold made-up secrets of test accounts and of
# databases that do not exist, to check that the product never shows them.
sonar.issue.ignore.multicriteria.testSecrets.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.testSecrets.resourceKey=packages/*/test/**
sonar.issue.ignore.multicriteria.witnessSecret.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.witnessSecret.resourceKey=packages/testing/src/test-repository/fixture.ts

# The rules of the default test charter are data, each written alike: their likeness is no duplicated code.
sonar.cpd.exclusions=packages/harness/src/charter/default-charter.ts
