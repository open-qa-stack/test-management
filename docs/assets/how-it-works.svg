<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">How Open QA Stack works</title>
<desc id="d">What you know of your applications, your request and the memory of the agents go in. Agents map each source once: a source cartographer, an application explorer and a domain writer. Then, level by level — smoke, functional, business, cross-application, end-to-end, visual — a planner explores the application and proposes scenarios, a plan reviewer sets aside what is already tested, a writer writes and runs each Playwright test, and two reviewers check it against its plan and its code quality, all inside a harness that accepts on evidence and refuses with a reason. The result is a Playwright project in your repository, on a branch. People decide: they review each test, report defects and run campaigns; a correction goes back to the writer and can become an instruction in the memory.</desc>
