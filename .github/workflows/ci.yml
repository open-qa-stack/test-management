name: ci

on:
  pull_request:
  push:
    branches: [main]
  # By hand, from the Actions tab or with `gh workflow run ci`, for a branch whose pushes do not start it.
  workflow_dispatch:

# The pipeline reads the repository and nothing else: it holds no secret and publishes nothing, so
# that it runs the same way for a pull request that comes from a fork.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress; main keeps every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The check runs on several machines at once: the steps before the tests, the tests of the root in parts, and the
  # packages with a test script of their own; the job named check then merges the coverage of the parts and holds
  # it to the thresholds. A pull request tests the packages it touches and those that depend on them; main tests
  # every package.

  static:
    # Type check, lint, format, build, coverage directives and secrets, on the whole workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check --only static

  tests:
    # A part of the test files of the root, by the --shard of Vitest; each writes what it found and covered as a report.
    name: tests (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The packages a pull request touches are read from its history.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # The browser the tests download, kept from one run to the next while the lockfile pins the same version.
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Browser of the tests
        # The tests of the browser tools drive a real Chromium, at the version the workspace pins; a browser in the
        # cache is not downloaded again, the libraries of the system it needs still are installed.
        run: pnpm --filter @open-qa-stack/tools exec playwright-core install --with-deps chromium
      - name: Build
        # The tests of the console run its build, and those of the command line serve it.
        run: pnpm build
      - name: Tests
        # The tests of the store on PostgreSQL start a disposable server with the Docker of the runner.
        run: pnpm check --part ${{ matrix.part }}/4 ${{ github.event_name == 'pull_request' && format('--affected origin/{0}', github.event.pull_request.base.ref) || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.part }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # What the page of a test of the console that failed showed, and what it logged.
        if: failure()
        with:
          name: failures-${{ matrix.part }}
          path: .vitest/failures/
          include-hidden-files: true
          if-no-files-found: ignore

  own:
    # The packages with a test script of their own, check alone, on a machine of its own, with its coverage.
    name: own tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [check]
        include:
          - package: check
            folder: packages/check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Tests
        # The tests of the API on PostgreSQL start a disposable server with the Docker of the runner.
        run: pnpm check --part own:${{ matrix.folder }} ${{ github.event_name == 'pull_request' && format('--affected origin/{0}', github.event.pull_request.base.ref) || '' }}
        env:
          OQAS_COVERAGE_REPORT: coverage/own-${{ matrix.package }}.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-own-${{ matrix.package }}
          path: coverage/own-${{ matrix.package }}.info
          if-no-files-found: ignore

  check:
    # The name the protection of main requires: every job above passed, and the parts of the tests, merged, cover
    # 100 % of the code of the packages they test. Then, with the token, the SonarCloud analysis of the code and of
    # the coverage, configured by sonar-project.properties.
    needs: [static, tests, own]
    # It runs whatever the jobs above gave: a required job skipped would count as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Whether the analysis runs: a boolean, so that the token itself reaches that step alone.
      SONAR_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Every job above passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "static: ${{ needs.static.result }}, tests: ${{ needs.tests.result }}, own tests: ${{ needs.own.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The analysis compares a pull request with its base, and the check reads the packages it touches: both need the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-*
          path: .vitest/blob/
          merge-multiple: true
        # A part that tested nothing kept no report; a report missing where tests ran fails the merge.
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-own-*
          path: coverage/
          merge-multiple: true
        continue-on-error: true
      - name: Merged coverage
        run: pnpm check --merge ${{ github.event_name == 'pull_request' && format('--affected origin/{0}', github.event.pull_request.base.ref) || '' }}
        env:
          OQAS_COVERAGE_REPORT: coverage/merged.info
      - name: One coverage report
        # The analysis reads one report: that of the merged parts, then that of the packages with their own tests.
        run: cat coverage/merged.info coverage/own-*.info > coverage/lcov.info 2>/dev/null || cp coverage/merged.info coverage/lcov.info
      - name: SonarCloud analysis
        # Reads sonar-project.properties and the coverage report above. Skipped without the token, as in a pull
        # request from a fork; the token reaches this step alone.
        if: env.SONAR_AVAILABLE == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  hygiene:
    # Every commit the pull request brings, not only its last: the message of each follows the
    # convention and carries no trailer, and no line it adds holds a secret.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan
        env:
          # The commits of the pull request, or the last ones of main after a merge.
          SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~20..HEAD' }}
        run: pnpm scan "$SCAN_RANGE"

  advisories:
    # The pinned production dependencies against the advisory database: a known vulnerability fails the run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
