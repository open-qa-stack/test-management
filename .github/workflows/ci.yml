name: ci

on:
  pull_request:
  push:
    branches: [main]
  # By hand, from the Actions tab or with `gh workflow run ci`, for a branch whose pushes do not start it.
  workflow_dispatch:

# The pipeline reads the repository and nothing else: it holds no secret and publishes nothing, so
# that it runs the same way for a pull request that comes from a fork.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress; main keeps every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # The single command that tells whether a commit can be delivered, on a clean clone.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser of the tests
        # The tests of the browser tools drive a real Chromium, at the version the workspace pins.
        run: pnpm --filter @open-qa-stack/tools exec playwright-core install --with-deps chromium
      - name: Check
        # Type check, lint, format, build, coverage directives, secrets, then the tests at full
        # coverage. The tests of the API start a disposable PostgreSQL with the Docker of the runner.
        run: pnpm check

  hygiene:
    # Every commit the pull request brings, not only its last: the message of each follows the
    # convention and carries no trailer, and no line it adds holds a secret.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan
        env:
          # The commits of the pull request, or the last ones of main after a merge.
          SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~20..HEAD' }}
        run: pnpm scan "$SCAN_RANGE"

  advisories:
    # The pinned production dependencies against the advisory database: a known vulnerability fails the run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
