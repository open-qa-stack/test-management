# Weekly proposals for the pinned dependencies and the actions of the pipeline. The updates of one
# kind come in one pull request, so that the pipeline runs once for them; nothing merges on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # The types of Node.js follow the runtime the project supports, the major that .nvmrc names, not the latest one: a
      # newer major types APIs the supported runtime does not have, and breaks the type check.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
